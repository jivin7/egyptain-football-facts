<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ce1126">
  <meta name="google-adsense-account" content="ca-pub-8947582768784485">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8947582768784485" crossorigin="anonymous"></script>
  <meta name="description" content="Browse Egyptian football facts by club or category.">
  <title>Facts — Egyptian Football Facts</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="app-shell">
    <div class="subpage-bar">
      <a href="index.html" class="club-page-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
      </a>
      <h1 class="subpage-title">Facts</h1>
      <a href="saved.html" class="subpage-link">Saved</a>
    </div>

    <main class="app-main facts-page">
      <section class="facts-hero">
        <h2 id="factsPageTitle">Egypt club facts</h2>
        <p id="factsPageBlurb">Search any Egyptian club, or browse by category.</p>
      </section>

      <section class="section facts-search-section">
        <div class="club-search">
          <label class="search-label" for="factsClubSearch">Search Egypt clubs</label>
          <div class="search-box">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="factsClubSearch" class="search-input" placeholder="Ahly, Zamalek, Masry, Aswan…" autocomplete="off">
          </div>
          <p class="search-hint" id="factsSearchHint"></p>
          <div class="search-results is-visible" id="factsClubResults"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">CATEGORIES</h2>
        </div>
        <div class="facts-cat-grid" id="factsCatGrid"></div>
      </section>

      <section class="section" id="factsListSection">
        <div class="section-header">
          <h2 class="section-title" id="factsListTitle">All clubs</h2>
          <span class="api-status" id="factsListCount"></span>
        </div>
        <div id="factsList" class="facts-list"></div>
      </section>

      <footer class="site-footer site-footer-compact">
        <nav class="footer-links" aria-label="Legal and info">
          <a href="about.html">About</a>
          <a href="privacy.html">Privacy</a>
          <a href="contact.html">Contact</a>
          <a href="terms.html">Terms</a>
        </nav>
        <p class="footer-copy">&copy; 2026 Egyptian Football Facts</p>`n        <p class="footer-credit">Made by jivin hany</p>
      </footer>
    </main>

    <nav class="bottom-nav mobile-only">
      <a href="index.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Home</span>
      </a>
      <a href="facts.html" class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <span>Facts</span>
      </a>
      <a href="videos.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        <span>Videos</span>
      </a>
      <a href="saved.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Saved</span>
      </a>
      <a href="about.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>About</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="shared-storage.js"></script>
  <script src="curated-facts.js"></script>

  <script src="facts.js"></script>

</html>
